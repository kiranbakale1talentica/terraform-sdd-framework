# Infrastructure Specification — User Profiles DynamoDB Table (dev)
metadata:
  service_name: "user-profiles"
  display_name: "User Profiles NoSQL Data Store"
  description: "High-performance, serverless DynamoDB table for managing user profile documents, preferences, and metadata."
  owner: "User Service Team"
  cost_center: "DevOps-102"
  spec_version: "1.0"
  status: approved
  created_date: "2026-08-06"
  approved_date: "2026-08-06"
  approved_by: "DevOps Lead"

environments:
  target:
    - dev
  isolation: per_environment
  promotion_strategy: "Feature branch PR with automated tfsec/checkov security scan and terraform plan verification"

cloud:
  provider: aws
  regions:
    primary: "ap-south-1"
    dr: null
  accounts:
    dev: "682563173581"

workload:
  type: "database"
  runtime: null
  language: null
  framework: null
  expected_peak_instances: null
  expected_rps: 500
  latency_sla_ms: 10
  stateful: true

networking:
  public_internet_access: false
  public_access_method: null
  vpc_required: false
  subnet_strategy: null
  cross_service_communication:
    method: "direct"
    services: ["user-service", "auth-service"]
  dns:
    custom_domain: null
    private_dns: false
  cdn_required: false
  vpn_required: false
  waf_required: false
  ddos_protection: basic

compute:
  instance_type: null
  instance_count_min: 0
  instance_count_max: 0
  auto_scaling: true
  auto_scaling_triggers: ["request-rate"]
  spot_acceptable: false

security:
  compliance_frameworks: ["soc2"]
  data_classification: confidential
  iam:
    identity_model: iam-roles
    cross_account_access: false
    mfa_required: false
  secrets_management:
    provider: aws-secrets-manager
    secret_paths: []
  encryption:
    at_rest: true
    at_rest_key_type: provider-managed
    in_transit: true
    tls_version_minimum: "1.2"
  network_policy: default-deny
  vulnerability_scanning: true
  audit_logging: true

availability:
  sla_target_percent: 99.99
  multi_az: true
  multi_region: false
  ha_model: active-active
  zero_downtime_deployments: true

disaster_recovery:
  rto_hours: 1
  rpo_hours: 1
  backup_frequency: continuous
  backup_retention_days: 35
  cross_region_backup: false
  dr_runbook_required: false

data_stores:
  - type: nosql
    engine: dynamodb
    size: null
    storage_gb: 50
    multi_az: true
    read_replicas: 0
    backup_enabled: true
    backup_retention_days: 35

observability:
  metrics:
    enabled: true
    platform: cloudwatch
  logging:
    enabled: true
    platform: cloudwatch-logs
    retention_days: 30
  tracing:
    enabled: false
    platform: null
  alerting:
    enabled: true
    channels: ["email"]
    alert_on: ["high-error-rate", "cost-anomaly"]
  dashboards:
    required: false
    platform: null

cost:
  monthly_budget_usd: 15
  cost_anomaly_alerts: true
  reserved_instances: false
  cost_optimization_notes: "PAY_PER_REQUEST (On-Demand) billing mode to eliminate idle compute costs in dev."

open_questions: []

decisions:
  - decision: "Use DynamoDB PAY_PER_REQUEST Billing Mode, KMS Server-Side Encryption, and Continuous Point-in-Time Recovery (PITR)"
    adr_file: "specs/user-profiles/dev/decisions/ADR-001-dynamodb-billing-and-security.md"
    date: "2026-08-06"
