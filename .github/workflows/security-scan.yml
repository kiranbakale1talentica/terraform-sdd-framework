name: 'Security Scan'

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    name: 'Security Scan (Checkov)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Security Scan
        id: checkov
        run: |
          checkov -d terraform/ --framework terraform -o cli -o sarif --output-file-path console,results.sarif > checkov_cli.txt || true
          cat checkov_cli.txt

      - name: Upload SARIF report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: checkov

      - name: Generate Workflow Summary & PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            let failed = 0;
            let tableRows = '';

            try {
              if (fs.existsSync('results.sarif')) {
                const sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
                const runs = sarif.runs || [];
                
                runs.forEach(run => {
                  (run.results || []).forEach(res => {
                    const ruleId = res.ruleId || 'N/A';
                    const msg = res.message ? res.message.text : 'No description';
                    const location = res.locations && res.locations[0] && res.locations[0].physicalLocation
                      ? `${res.locations[0].physicalLocation.artifactLocation.uri}:${res.locations[0].physicalLocation.region ? res.locations[0].physicalLocation.region.startLine : 1}`
                      : 'N/A';
                    const level = res.level === 'error' ? '❌ High/Error' : '⚠️ Warning';
                    
                    failed++;
                    tableRows += `| ${ruleId} | ${level} | ${location} | ${msg} |\n`;
                  });
                });
              }
            } catch (err) {
              console.log('Error parsing SARIF file:', err);
            }

            const statusText = failed > 0 ? '⚠️ Action Required' : '✅ Passed';
            let summaryMarkdown = '## 🛡️ Checkov Infrastructure Security Scan Report\n\n';
            summaryMarkdown += '| Metric | Count | Status |\n';
            summaryMarkdown += '|---|---|---|\n';
            summaryMarkdown += '| ❌ Failed Checks | ' + failed + ' | ' + statusText + ' |\n';
            summaryMarkdown += '| 🛡️ Scan Framework | Terraform | HashiCorp HCL Audit |\n\n';

            if (failed > 0) {
              summaryMarkdown += '### ⚠️ Detected Security Findings\n\n';
              summaryMarkdown += '| Rule ID | Severity | File & Line | Description |\n';
              summaryMarkdown += '|---|---|---|---|\n';
              summaryMarkdown += tableRows + '\n';
            } else {
              summaryMarkdown += '### ✅ All Security Checks Passed!\nNo infrastructure vulnerabilities or misconfigurations detected.\n';
            }

            summaryMarkdown += '\n---\n*Report generated by Checkov scanner in CI pipeline.*';

            // 1. Output to GitHub Step Summary (Visible directly in Workflow Run UI)
            await core.summary.addRaw(summaryMarkdown).write();

            // 2. Post or Update PR Comment if triggered by Pull Request
            if (context.eventName === 'pull_request') {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Checkov Infrastructure Security Scan Report'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: summaryMarkdown
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: summaryMarkdown
                });
              }
            }
