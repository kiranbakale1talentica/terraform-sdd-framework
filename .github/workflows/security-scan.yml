name: 'Security Scan (Checkov Audit)'
run-name: 'Security Scan: Checkov Audit - PR #${{ github.event.number || github.ref_name }}'

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    name: 'Security & Quality Scan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

      - name: Generate Execution Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### Pipeline Execution Summary: Security Scan

          | Check / Step | Status | Scope |
          | :--- | :--- | :--- |
          | Code Checkout | success | `terraform/` |
          | Checkov Static Security Analysis | ${{ steps.checkov.outcome }} | CIS AWS Benchmarks |
          EOF
