name: 'Terraform Destroy'

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to destroy (e.g. first-s3-bucket)'
        required: true
        default: 'first-s3-bucket'
        type: string
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "ap-south-1"
  OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.service }}/dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform/services/${{ github.event.inputs.service }}/dev

    steps:
      - name: Verify Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Error: Confirmation input did not match 'DESTROY'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
