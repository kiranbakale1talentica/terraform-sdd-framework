name: 'Terraform Destroy (Teardown)'
run-name: 'Terraform Destroy: Teardown ${{ github.event.inputs.service }}'

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to destroy (e.g. first-s3-bucket)'
        required: true
        default: 'first-s3-bucket'
        type: string
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "ap-south-1"
  OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.service }}/dev
    runs-on: ubuntu-latest

    steps:
      - name: Verify Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Error: Confirmation input did not match 'DESTROY'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover Service Working Directory
        id: dir
        run: |
          TARGET_DIR="terraform/services/${{ github.event.inputs.service }}/dev"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory $TARGET_DIR does not exist in repo."
            exit 1
          fi
          echo "working_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Terraform Destroy
        id: destroy
        run: terraform destroy -auto-approve -input=false
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Generate Execution Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### Pipeline Execution Summary: Terraform Destroy (Teardown)

          | Check / Step | Status | Target Directory |
          | :--- | :--- | :--- |
          | Confirmation Verification | success | `DESTROY` |
          | Target Directory Discovery | ${{ steps.dir.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | AWS OIDC Authentication | success | `arn:aws:iam::...` |
          | Terraform Initialization | ${{ steps.init.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | Terraform Destroy Execution | ${{ steps.destroy.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          EOF
