name: 'Terraform Apply (Deployment)'
run-name: 'Terraform Apply: Deploy to AWS (${{ github.ref_name }})'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: false
        default: 'first-s3-bucket'
        type: string

permissions:
  id-token: write # Required for AWS OIDC
  contents: read  # Required to checkout code

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "ap-south-1"
  OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  apply:
    name: Apply first-s3-bucket dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Service Working Directory
        id: dir
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            TARGET_DIR="terraform/services/${{ github.event.inputs.service }}/dev"
          else
            # Automatically find the first modified terraform/services directory
            CHANGED_DIR=$(git diff --name-only HEAD~1...HEAD | grep '^terraform/services/' | head -n 1 | cut -d'/' -f1-4)
            if [ -n "$CHANGED_DIR" ]; then
              TARGET_DIR="$CHANGED_DIR"
            else
              TARGET_DIR=$(find terraform/services -mindepth 2 -maxdepth 2 -type d | head -n 1)
            fi
          fi

          if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
            echo "No valid terraform service directory found to execute apply."
            exit 1
          fi

          echo "working_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          echo "Selected working directory: $TARGET_DIR"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Generate Execution Summary
        if: always()
        run: |
          echo "### Pipeline Execution Summary: Terraform Apply (Deployment)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check / Step | Status | Target Directory |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Working Directory Discovery | ${{ steps.dir.outcome }} | \`${{ steps.dir.outputs.working_dir }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AWS OIDC Authentication | success | \`arn:aws:iam::...\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Initialization | ${{ steps.init.outcome }} | \`${{ steps.dir.outputs.working_dir }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply (Deployment) | ${{ steps.apply.outcome }} | \`${{ steps.dir.outputs.working_dir }}\` |" >> $GITHUB_STEP_SUMMARY
