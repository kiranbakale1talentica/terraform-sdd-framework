name: 'Terraform Plan & Validate'
run-name: 'Terraform Plan & Validate: PR #${{ github.event.number || github.ref_name }}'

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to plan (e.g. first-s3-bucket)'
        required: false
        default: 'first-s3-bucket'
        type: string
      environment:
        description: 'Environment to plan (e.g. dev)'
        required: false
        default: 'dev'
        type: string

permissions:
  id-token: write      # Required for AWS OIDC
  contents: read       # Required to checkout code
  pull-requests: write # Required to comment on PRs

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "ap-south-1"
  OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  plan:
    name: 'Validate and Plan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Service Working Directory
        id: dir
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            TARGET_DIR="terraform/services/${{ github.event.inputs.service }}/${{ github.event.inputs.environment || 'dev' }}"
          else
            # Automatically find the first modified terraform/services directory in PR
            CHANGED_DIR=$(git diff --name-only origin/main...HEAD | grep '^terraform/services/' | head -n 1 | cut -d'/' -f1-4)
            if [ -n "$CHANGED_DIR" ]; then
              TARGET_DIR="$CHANGED_DIR"
            else
              # Fallback: search for any existing environment directory
              TARGET_DIR=$(find terraform/services -mindepth 2 -maxdepth 2 -type d | head -n 1)
            fi
          fi

          if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
            echo "No valid terraform service directory found to execute plan."
            exit 1
          fi

          echo "working_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          echo "Selected working directory: $TARGET_DIR"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ steps.dir.outputs.working_dir }}
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Init TFLint
        run: tflint --init
        working-directory: ${{ steps.dir.outputs.working_dir }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        id: tflint
        run: tflint -f compact --recursive
        working-directory: ${{ steps.dir.outputs.working_dir }}
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ steps.dir.outputs.working_dir }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ steps.dir.outputs.working_dir }}
        continue-on-error: true

      - name: Generate Execution Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### Pipeline Execution Summary: Terraform Plan & Validate

          | Check / Step | Status | Target Directory |
          | :--- | :--- | :--- |
          | Working Directory Discovery | ${{ steps.dir.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | Terraform Format Check | ${{ steps.fmt.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | TFLint Static Analysis | ${{ steps.tflint.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | Terraform Initialization | ${{ steps.init.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | Terraform Syntax Validation | ${{ steps.validate.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          | Terraform Execution Plan | ${{ steps.plan.outcome }} | `${{ steps.dir.outputs.working_dir }}` |
          EOF

      - name: Post PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          DIR_OUTCOME: ${{ steps.dir.outcome }}
          DIR_PATH: ${{ steps.dir.outputs.working_dir }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          TFLINT_OUTCOME: ${{ steps.tflint.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Pipeline Execution Summary: Terraform Plan & Validate'));

            const planOutput = process.env.PLAN_STDOUT || 'No execution plan output recorded.';
            const body = [
              '### Pipeline Execution Summary: Terraform Plan & Validate',
              '',
              '| Check / Step | Status | Target Directory |',
              '| :--- | :--- | :--- |',
              `| Working Directory Discovery | \`${process.env.DIR_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              `| Terraform Format Check | \`${process.env.FMT_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              `| TFLint Static Analysis | \`${process.env.TFLINT_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              `| Terraform Initialization | \`${process.env.INIT_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              `| Terraform Syntax Validation | \`${process.env.VALIDATE_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              `| Terraform Execution Plan | \`${process.env.PLAN_OUTCOME}\` | \`${process.env.DIR_PATH}\` |`,
              '',
              '<details><summary>View Full Terraform Plan Output</summary>',
              '',
              '```hcl',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by: @${context.actor} | Commit: [${context.sha.substring(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})*`
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
