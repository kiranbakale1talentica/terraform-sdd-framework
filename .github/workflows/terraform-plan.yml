name: Terraform Plan & Validate

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

permissions:
  id-token: write # Required for AWS OIDC
  contents: read  # Required to checkout code
  pull-requests: write # Required to comment on PRs

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: "us-east-1"
  # Replace this with your actual IAM role ARN in a real implementation
  OIDC_ROLE_ARN: "arn:aws:iam::682563173581:role/terraform-sdd-github-actions-role"

jobs:
  plan:
    name: Validate and Plan
    runs-on: ubuntu-latest

    # This example runs for the dev environment. In a real setup, you'd use a matrix
    # strategy or separate jobs to run against modified roots.
    defaults:
      run:
        # NOTE: Update 'YOUR_SERVICE_NAME' to match your actual service directory
        working-directory: ./terraform/services/YOUR_SERVICE_NAME/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact --recursive

      - name: Terraform Init
        id: init
        # In a real environment, you provide the backend config via file or CLI args
        # run: terraform init -backend-config=../../../backends/dev.tfbackend
        # For this example, we use local state or bypass backend for validation
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Security Scan - Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: true # Set to false to block PRs on security issues

