name: 'Drift Detection'

on:
  schedule:
    - cron: '0 9 * * MON' # Run every Monday at 9 AM UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to check for drift'
        required: false
        default: 'docs-portal'
        type: string
      environment:
        description: 'Environment to check for drift'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "us-west-1"
  OIDC_ROLE_ARN: "arn:aws:iam::682563173581:role/terraform-sdd-github-actions-role"

jobs:
  drift-detection:
    name: 'Detect Configuration Drift'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform/services/${{ github.event.inputs.service || 'docs-portal' }}/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - GitHub Context
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Ref        : ${{ github.ref }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Workflow   : ${{ github.workflow }}"
          echo "Event      : ${{ github.event_name }}"

      - name: Debug - OIDC Token Sub Claim
        id: debug_token
        run: |
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || echo "$TOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null)
          echo "=== Full OIDC Claims ==="
          echo "$PAYLOAD" | python3 -m json.tool 2>/dev/null || echo "$PAYLOAD"
          echo ""
          echo "sub  : $(echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sub','NOT FOUND'))" 2>/dev/null)"
          echo "aud  : $(echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('aud','NOT FOUND'))" 2>/dev/null)"
          echo "iss  : $(echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('iss','NOT FOUND'))" 2>/dev/null)"
          echo "========================"
          echo "Trust policy expects sub LIKE: repo:kiranbakale1talentica/terraform-sdd-framework:*"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Check Drift
        id: drift
        run: |
          terraform plan -detailed-exitcode -no-color -out=drift_plan || exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ ${exit_code:-0} -eq 2 ]; then
            echo "::warning title=Drift Detected::Infrastructure configuration drift was detected!"
          elif [ ${exit_code:-0} -eq 0 ]; then
            echo "No infrastructure drift detected. Infrastructure is in sync with state."
          else
            echo "Error running terraform plan during drift detection."
            exit 1
          fi
