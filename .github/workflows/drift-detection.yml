name: 'Drift Detection'

on:
  schedule:
    - cron: '0 9 * * MON' # Run every Monday at 9 AM UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to check for drift'
        required: false
        default: 'first-s3-bucket'
        type: string

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

env:
  TF_VERSION: "1.10.3"
  AWS_REGION: "ap-south-1"
  OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  drift-detection:
    name: 'Detect Configuration Drift'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Print GitHub Repository & Event Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event Name: ${{ github.event_name }}"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform/services/${{ github.event.inputs.service || 'first-s3-bucket' }}/dev
        run: terraform init

      - name: Check Drift
        id: drift
        working-directory: ./terraform/services/${{ github.event.inputs.service || 'first-s3-bucket' }}/dev
        run: |
          terraform plan -detailed-exitcode -no-color -out=drift_plan || exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ ${exit_code:-0} -eq 2 ]; then
            echo "::warning title=Drift Detected::Infrastructure configuration drift was detected!"
          elif [ ${exit_code:-0} -eq 0 ]; then
            echo "No infrastructure drift detected. Infrastructure is in sync with state."
          else
            echo "Error running terraform plan during drift detection."
            exit 1
          fi
